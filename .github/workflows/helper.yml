name: helper

on:
  push:
    paths: ["helper/**", ".github/workflows/helper.yml"]
  pull_request:
    paths: ["helper/**", ".github/workflows/helper.yml"]

jobs:
  helper:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: HelperCore tests (swiftc, arm64 + x86_64; runs the native slice)
        working-directory: helper
        run: scripts/build.sh
      - name: Build the app (arm64 + x86_64, ad-hoc signature)
        working-directory: helper
        run: scripts/build-app.sh
      - name: sign-dev.sh (stubbed security; a throwaway keychain, never the login keychain)
        working-directory: helper
        run: scripts/test-sign-dev.sh --real
      - name: Smoke test the app without Reminders access
        working-directory: helper
        run: node scripts/smoke.mjs
      - name: SwiftPM build and tests (additional check; tests are an executable, not `swift test`)
        working-directory: helper
        run: |
          swift build -c release
          swift run -c release helper-core-tests
