name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A branch without a pull request (e.g. before one is opened).
  workflow_dispatch:

permissions:
  contents: read

# D-010 §1.3. This PR has the lint and unit jobs; crash, e2e, helper and
# helper-protocol come with the PRs that bring their code (§11).
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The TypeScript SDK: until @openlfcp/* 0.7.0 is on npm, the eight packages of
      # openlfcp/sdk-ts at the commit in sdk-ts.lock, packed by scripts/sdk-ts-pack.mjs into
      # vendor/sdk-ts/; pnpm-lock.yaml holds each tarball's integrity (docs/devel/sdk-pin.md).
      - id: sdk-ts-lock
        run: echo "commit=$(jq -er .commit sdk-ts.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: openlfcp/sdk-ts
          ref: ${{ steps.sdk-ts-lock.outputs.commit }}
          # Under vendor/ (gitignored): out of biome's and the boundary check's way.
          path: vendor/sdk-ts-src
          # Only what the packages build from (with the root files).
          sparse-checkout: packages
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: node scripts/sdk-ts-pack.mjs --checkout vendor/sdk-ts-src
      - run: pnpm install --frozen-lockfile
      # biome, the package boundaries (and their self-test).
      - run: pnpm lint
      # tsc -b over the packages, then the tests' types.
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The TypeScript SDK: until @openlfcp/* 0.7.0 is on npm, the eight packages of
      # openlfcp/sdk-ts at the commit in sdk-ts.lock, packed by scripts/sdk-ts-pack.mjs into
      # vendor/sdk-ts/; pnpm-lock.yaml holds each tarball's integrity (docs/devel/sdk-pin.md).
      - id: sdk-ts-lock
        run: echo "commit=$(jq -er .commit sdk-ts.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: openlfcp/sdk-ts
          ref: ${{ steps.sdk-ts-lock.outputs.commit }}
          # Under vendor/ (gitignored): out of biome's and the boundary check's way.
          path: vendor/sdk-ts-src
          # Only what the packages build from (with the root files).
          sparse-checkout: packages
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: node scripts/sdk-ts-pack.mjs --checkout vendor/sdk-ts-src
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
