name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# D-010 §1.3. This PR has the lint and unit jobs; crash, e2e, helper and
# helper-protocol come with the PRs that bring their code (§11).
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # biome, the package boundaries (and their self-test).
      - run: pnpm lint
      # tsc -b over the packages, then the tests' types.
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
